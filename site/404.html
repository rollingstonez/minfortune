<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 | 민원장 철학원</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans KR",sans-serif;background:#e8e0d0;color:#1c1a17;line-height:1.8;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:600px;width:100%;background:#f6f1e7;border-radius:20px;padding:56px 28px;text-align:center;
       box-shadow:0 10px 40px rgba(0,0,0,.12)}
  .yy{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;
      background:conic-gradient(#f3ead7 0 50%,#1c1a17 50% 100%);border:2px solid #b58a3e}
  h1{font-family:"Nanum Myeongjo",serif;font-size:1.7rem;font-weight:800;line-height:1.45}
  h1 .u{color:#96702c}
  p{color:#6f665a;margin-top:14px;font-size:1rem}
  .divider{width:44px;height:2px;background:#b58a3e;margin:20px auto;opacity:.6}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:26px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 30px;border-radius:999px;
       font-weight:700;font-size:1.02rem;text-decoration:none;width:100%;max-width:320px}
  .btn-gold{background:#b58a3e;color:#241d0f}
  .btn-ghost{border:1.5px solid rgba(28,26,23,.3);color:#1c1a17}
</style>
</head>
<body>
  <div class="box">
    <div class="yy"></div>
    <h1>찾으시는 페이지가 <span class="u">없습니다</span></h1>
    <div class="divider"></div>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>궁금하신 점은 전화로 편하게 문의해 주세요.</p>
    <div class="btns">
      <a class="btn btn-gold" href="tel:010-5750-3883">📞 010-5750-3883 전화 문의</a>
      <a class="btn btn-ghost" href="/">홈으로 돌아가기</a>
    </div>
  </div>
</body>
</html>
